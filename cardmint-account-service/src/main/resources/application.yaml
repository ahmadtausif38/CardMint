  spring:
    application:
      name: cardmint-account-service

    datasource:
      url: jdbc:postgresql://localhost:5432/cardmint_account_db
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: test123

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true

  server:
    port: 8082

  logging:
    level:
      com.cardmint.common.kafka: INFO

  cardmint:
    kafka:
      bootstrap-servers: localhost:9092
      producer:
        acks: all
        retries: 3
      consumer:
        group-id: account-service-group
        auto-offset-reset: earliest
      topics:
        cardEvents: cardmint.card.events
        transactionEvents: cardmint.transaction.events
        accountEvents: cardmint.account.events