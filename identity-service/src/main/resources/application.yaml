server:
  port:  8083

logging:
  level:
    com.cardmint.common.kafka: INFO

spring:
  application:
    name: identity-service
    id: CRDMNTIDY

  datasource:
    url: jdbc:postgresql://localhost:5432/cardmint_identity_db
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: test123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

cardmint:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
    consumer:
      group-id: identity-service-group
      auto-offset-reset: earliest
    topics:
      cardEvents: cardmint.card.events
      transactionEvents: cardmint.transaction.events
      accountEvents: cardmint.account.events

  security:
    pan:
      hmac-key: "L2hsdCaFxaY07CyzeSyJ0q7brZCRopiRQjDvwUskW9I="
      encryption-key: "bORLSNm+HSWluIdDCA8OfBHbOK/5BCw+ZBYiONoqSzY="


